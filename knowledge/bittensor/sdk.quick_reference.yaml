# Bittensor 11.1.0 reference for Validity's current dependencies.
# Validator chain operations remain owned by the actor-based Pylon integration.

installation:
  package: bittensor==11.1.0
  lockfiles: [validator/uv.lock, miner/uv.lock]
  wallet: "Bundled with bittensor; application code does not import bittensor_wallet."
  sidecar: "Validity's Pylon/TurboBT build also uses bittensor==11.1.0; the legacy wallet package is removed. See docs/chain-service.md."
  source: https://pypi.org/project/bittensor/11.1.0/

wallet:
  defaults: {path: "~/.bittensor/wallets", name: default, hotkey: default}
  init: |
    from bittensor.wallet import Wallet
    wallet = Wallet(path="~/.bittensor/wallets", name="default", hotkey="default")
    key = wallet.get_hotkey()
  startup: |
    from pathlib import Path
    from validity_protocol.identity import load_signing_key
    key = load_signing_key(Path("~/.bittensor/wallets").expanduser(), "default", "default")
  requirements:
    - "Use existing SR25519 signing hotkeys; public-only keys cannot serve or validate."
    - "Read current wallet files directly, including numeric cryptoType fields."
    - "Never rewrite operator keys as a dependency compatibility workaround."
  addresses:
    coldkey_public: wallet.coldkeypub.ss58_address
    hotkey: key.ss58_address

cryptography:
  imports: |
    from bittensor.sp_core import Keypair, ss58_decode, ss58_encode
  sign: "key.sign(message_bytes) -> bytes"
  verify: "key.verify(message_bytes, signature_bytes) -> bool"
  address_validation: "validity_protocol.identity.is_valid_ss58_address validates canonical SS58 format 42."
  types: "Native APIs used by Validity have local stubs in protocol/typings/bittensor_core."

operator_chain_checks:
  init: |
    from bittensor import Subtensor
    async with Subtensor("test") as chain:
        tempo = await chain.query(("SubtensorModule", "Tempo"), [568])
        uid = await chain.neurons.uid(hotkey_ss58=key.ss58_address, netuid=568)
  reads:
    genesis: 'await chain.query(("System", "BlockHash"), [0])'
    weights: 'await chain.query(("SubtensorModule", "Weights"), [568, validator_uid])'
    axon: 'await chain.query(("SubtensorModule", "Axons"), [568, key.ss58_address])'
  preview: |
    from bittensor.intents.plan import Policy
    from bittensor.intents.serving import ServeAxon
    policy = Policy(max_fee_tao=0, max_spend_tao=0, allowed_netuids=[568])
    async with Subtensor("test", policy=policy) as chain:
        intent = ServeAxon(netuid=568, ip=public_ip, port=8080, protocol=4)
        plan = await chain.plan(intent, wallet)
        # Preview does not submit a transaction.
  execution:
    method: "await chain.execute(intent, wallet, wait_for_inclusion=True, wait_for_finalization=True)"
    result: "ExtrinsicResult: success, message, block_hash, extrinsic_id; to_dict() gives the receipt."
    requirements:
      - "Only execute operations already authorized by the user."
      - "Verify testnet genesis, registered identity and endpoint health before advertisement."
      - "Do not register hotkeys, stake or spend funds automatically."
      - "Read chain state independently after submission."

weights:
  runtime: "Use the validator's existing actor-owned weight setter and Pylon."
  sdk_intent: "bittensor.intents.weights.SetWeights auto-selects plain or timelocked submission."
  confirmation: "A submitted or queued timelock commit does not establish a revealed chain weight row."
